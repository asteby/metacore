name: Sync SDK docs mirror

# metacore-sdk is public, so a shallow clone needs no extra credentials —
# this avoids depending on a cross-repo PAT/secret that doesn't exist yet.
# If asteby/metacore-sdk ever goes private, add a repo secret
# `METACORE_SDK_READ_TOKEN` (PAT, `repo` scope, read-only) and pass it to
# the checkout step below via `token:`.
on:
  schedule:
    - cron: '17 6 * * *' # daily; catches same-day merges within 24h
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sdk-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metacore
        uses: actions/checkout@v6

      - name: Checkout metacore-sdk
        uses: actions/checkout@v6
        with:
          repository: asteby/metacore-sdk
          path: .sdk-src
          fetch-depth: 1

      - name: Run sync script
        id: sync
        run: |
          bash scripts/sync-sdk-docs.sh "$PWD/.sdk-src"
          rm -rf .sdk-src
          if git diff --quiet -- docs/sdk; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List out-of-sync Spanish translations
        if: steps.sync.outputs.changed == 'true'
        id: es
        run: |
          {
            echo "stale_es<<EOF"
            git diff --name-only -- docs/sdk \
              | sed 's#^docs/sdk/#docs/es/sdk/#' \
              | while read -r f; do [ -f "$f" ] && echo "- \`$f\` (manual translation review needed)"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_ES: ${{ steps.es.outputs.stale_es }}
        run: |
          branch="docs/sdk-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git config user.name "metacore-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sdk
          git commit -m "docs(sdk): sync mirrored SDK docs from metacore-sdk"
          git push origin "$branch"
          body="Automated sync of \`docs/sdk/*.md\` from the canonical source in [asteby/metacore-sdk](https://github.com/asteby/metacore-sdk)'s \`docs/\`.

          Generated by \`scripts/sync-sdk-docs.sh\`, run on a daily schedule (see \`.github/workflows/sync-sdk-docs.yml\`) — also runnable on demand via workflow_dispatch.

          \`\`\`
          $STALE_ES
          \`\`\`
          "
          gh pr create --base main --head "$branch" \
            --title "docs(sdk): sync mirrored SDK docs" \
            --body "$body"
